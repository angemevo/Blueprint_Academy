# L'équipe d'agents travaille ici, sur les serveurs de GitHub, sans l'ordinateur d'Ange.
# Elle utilise l'abonnement Claude Pro d'Ange (secret CLAUDE_CODE_OAUTH_TOKEN).
# Ce qui se passe et quand : docs/equipe-cloud.md. Le travail lui-même : scripts/equipe.py.
name: Équipe d'agents

on:
  schedule:
    # Heures UTC = heures d'Abidjan.
    # Équipes de nuit : chacune travaille jusqu'à 5 h 20, jamais après 7 h 30. Si une équipe tourne
    # encore, la suivante attend son tour ; si GitHub oublie un horaire, les autres le rattrapent.
    - cron: "5 20 * * *"   # 20 h 05 : première équipe (jusqu'à 1 h 30 environ)
    - cron: "35 23 * * *"  # 23 h 35 : deuxième équipe (prend le relais, jusqu'à 7 h 30 au plus tard)
    - cron: "5 3 * * *"    # 3 h 05 : relève de secours
    - cron: "40 7 * * *"   # 7 h 40 : rapport de la nuit dans le bureau (sans Claude)
    - cron: "0 19 * * 0"   # dimanche 19 h : pilotage, bilan, estimation et rapport PDF
  issue_comment:
    types: [created]       # Ange écrit dans son bureau : l'organisateur lui répond
  workflow_dispatch:
    inputs:
      mode:
        description: "Travail à lancer"
        type: choice
        options: [nuit, courrier, matin, pilotage, tech, rapport]
        default: nuit

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  equipe:
    # Un commentaire ne déclenche l'équipe que s'il vient d'Ange, dans son bureau.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'angemevo' &&
       contains(github.event.issue.labels.*.name, 'bureau'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Le courrier a sa propre file : il répond même pendant que l'équipe de nuit travaille.
    concurrency:
      group: ${{ (github.event_name == 'issue_comment' || inputs.mode == 'courrier') && 'organisateur' || 'equipe-agents' }}
      cancel-in-progress: false
    env:
      MODE: >-
        ${{ inputs.mode
            || (github.event_name == 'issue_comment' && 'courrier')
            || (github.event.schedule == '0 19 * * 0' && 'pilotage')
            || (github.event.schedule == '40 7 * * *' && 'matin')
            || 'nuit' }}
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Part maximale du quota hebdomadaire Claude que l'équipe peut utiliser (le reste est pour Ange).
      QUOTA_MAX_SEMAINE: ${{ vars.QUOTA_MAX_SEMAINE || '0.70' }}
      DUREE_EQUIPE_MIN: ${{ vars.DUREE_EQUIPE_MIN || '320' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Vérifier la clé de l'abonnement Claude
        if: env.MODE != 'rapport'
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN absent. Voir docs/equipe-cloud.md, étape 1."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          git config --global user.name "Équipe d'agents"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Le réseau de GitHub a parfois des ratés : trois essais avant d'abandonner
          essayer() { for i in 1 2 3; do "$@" && return 0; sleep 20; done; return 1; }
          if [ "$MODE" != "rapport" ]; then
            essayer npm install -g --no-fund --no-audit @anthropic-ai/claude-code
          fi
          if [ "$MODE" = "pilotage" ] || [ "$MODE" = "rapport" ]; then
            essayer pip install --quiet reportlab==4.2.5
            sudo apt-get install -y -q fonts-dejavu-core >/dev/null
          fi
          if [ "$MODE" = "nuit" ] || [ "$MODE" = "tech" ]; then
            essayer pip install --quiet playwright==1.48.0
            essayer python -m playwright install --with-deps chromium
            cp .env.example .env
          fi

      - name: Travail de l'équipe (${{ env.MODE }})
        run: scripts/cycle.sh "$MODE"

      - name: Garder les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-${{ env.MODE }}-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
