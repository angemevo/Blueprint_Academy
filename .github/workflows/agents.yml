# L'équipe d'agents travaille ici, sur les serveurs de GitHub, sans l'ordinateur d'Ange.
# Elle utilise l'abonnement Claude Pro d'Ange (secret CLAUDE_CODE_OAUTH_TOKEN).
# Guide de mise en route : docs/equipe-cloud.md
name: Équipe d'agents

on:
  schedule:
    # Heures UTC = heures d'Abidjan.
    - cron: "0 19 * * 0"   # dimanche 19 h : pilotage, bilan de la semaine et rapport PDF
    - cron: "20 23 * * *"  # chaque soir 23 h 20 : un cycle tech
    - cron: "20 4 * * *"   # chaque nuit 4 h 20 : un cycle tech (autre fenêtre de 5 h du quota)
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle à lancer"
        type: choice
        options: [tech, pilotage, rapport]
        default: tech

# Un seul cycle à la fois : le suivant attend que le précédent ait fini.
concurrency:
  group: equipe-agents
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CYCLE: ${{ inputs.cycle || (github.event.schedule == '0 19 * * 0' && 'pilotage' || 'tech') }}
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Part maximale du quota hebdomadaire Claude que l'équipe peut utiliser (le reste est pour Ange).
      QUOTA_MAX_SEMAINE: ${{ vars.QUOTA_MAX_SEMAINE || '0.70' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Vérifier la clé de l'abonnement Claude
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN absent. Voir docs/equipe-cloud.md, étape 1."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Claude Code et les outils des rapports
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet reportlab==4.2.5 playwright==1.48.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null
          git config --global user.name "Équipe d'agents"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .env.example .env

      - name: Cycle ${{ env.CYCLE }}
        run: scripts/cycle.sh "$CYCLE"

      - name: Garder les journaux du cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-${{ env.CYCLE }}-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
