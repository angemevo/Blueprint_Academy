<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de réunion des agents</title>
<style>
:root{
  --fond:#141414; --barre:#1f1f1f; --panneau:#1b1b1b; --tuile:#262626; --bord:#333;
  --texte:#ececec; --doux:#a6a6a6; --pale:#6f6f6f;
  --accent:#7b83eb; --ok:#5fcf80; --alerte:#f3b13c; --erreur:#ef6a6a;
  --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Ubuntu",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:14px/1.45 var(--sans)}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:52px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh}

/* Barre du haut */
.barre{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--barre);border-bottom:1px solid var(--bord)}
.titre{display:flex;align-items:center;gap:10px;min-width:60px}
.titre h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastille{width:9px;height:9px;border-radius:50%;background:var(--pale);flex:none}
.pastille.direct{background:var(--erreur);box-shadow:0 0 0 4px #ef6a6a33;animation:pulse 1.6s infinite}
.pastille.rejeu{background:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 7px #ef6a6a11}}
.etat{color:var(--doux);font-size:12.5px;white-space:nowrap;min-width:40px;overflow:hidden;text-overflow:ellipsis}
.chrono{font-variant-numeric:tabular-nums;color:var(--doux);font-size:13px}
.espace{flex:1}
.ctrl{display:flex;gap:8px;align-items:center;flex:none}
.btn{background:#2c2c2c;border:1px solid #3a3a3a;border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#353535}
.btn.actif{background:var(--accent);border-color:var(--accent);color:#fff}
select{background:#2c2c2c;border:1px solid #3a3a3a;border-radius:6px;padding:6px 8px;max-width:270px}

/* Corps */
.corps{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.scene{display:grid;grid-template-rows:minmax(220px,46%) minmax(0,1fr);grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;border-right:1px solid var(--bord)}
.cote{display:grid;grid-template-rows:minmax(0,1fr) 42%;min-height:0;min-width:0}

/* Tuiles */
.zone-tuiles{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-width:0;padding:14px 14px 8px;min-height:0}
.tuiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;min-height:0;min-width:0;overflow:hidden}
.vide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--pale);font-size:15px;pointer-events:none}
.tuile{flex:none;width:320px;height:180px;container-type:inline-size;position:relative;background:var(--tuile);border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:border-color .2s,opacity .5s,transform .5s;animation:entree .45s ease-out;overflow:hidden}
.tuile.parle{border-color:var(--accent)}
.tuile.agit{border-color:#4a4a4a}
.tuile.partie{opacity:.0;transform:scale(.94)}
@keyframes entree{from{opacity:0;transform:scale(.94)}}
.avatar{width:clamp(44px,22cqw,96px);height:clamp(44px,22cqw,96px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,8cqw,32px);margin-bottom:6%;font-weight:600;color:#fff;position:relative}
.tuile.parle .avatar::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--accent);animation:anneau 1.1s ease-in-out infinite}
@keyframes anneau{50%{inset:-11px;opacity:.45}}
.etiquette{position:absolute;left:10px;bottom:9px;right:10px;display:flex;flex-direction:column;gap:1px;text-shadow:0 1px 2px #000}
.nom{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center}
.role{font-size:11.5px;color:var(--doux)}
.statut{position:absolute;top:9px;left:10px;right:10px;font-size:11.5px;color:var(--doux);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onde{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.onde i{width:3px;background:var(--accent);border-radius:1px;height:4px}
.tuile.parle .onde i{animation:onde .8s infinite ease-in-out}
.tuile.parle .onde i:nth-child(2){animation-delay:.15s}.tuile.parle .onde i:nth-child(3){animation-delay:.3s}
@keyframes onde{50%{height:11px}}
.anciens{color:var(--pale);font-size:12px;text-align:center;min-height:16px;padding-top:6px}
.quota{font-size:12px;color:var(--doux);white-space:nowrap;font-variant-numeric:tabular-nums}
.quota.haut{color:var(--alerte)}.quota.critique{color:var(--erreur)}
.case{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--doux);white-space:nowrap;cursor:pointer}
.sys a{color:var(--accent)}

/* Terminaux */
.terminaux{display:grid;grid-template-rows:36px 1fr;min-height:0;border-top:1px solid var(--bord);background:#0f0f0f}
.onglets{display:flex;gap:2px;padding:4px 8px 0;background:var(--panneau);border-bottom:1px solid var(--bord);overflow-x:auto}
.onglet{padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--doux);font-size:12.5px;display:flex;gap:7px;align-items:center;white-space:nowrap;border:1px solid transparent;border-bottom:none}
.onglet.sel{background:#0f0f0f;color:var(--texte);border-color:var(--bord)}
.onglet .point{width:7px;height:7px;border-radius:50%}
.onglet .actif{width:6px;height:6px;border-radius:50%;background:var(--ok);display:none}
.onglet.travaille .actif{display:inline-block;animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.25}}
.onglet .epingle{font-size:10.5px;color:var(--pale)}
.console{margin:0;padding:12px 14px;overflow:auto;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;min-height:0}
.console .cmd{color:#e6e6e6}.console .cmd b{color:var(--ok);font-weight:600}
.console .sortie{color:#9a9a9a}
.console .err{color:var(--erreur)}
.console .action{color:#b9bcff}
.console .masque{color:var(--pale);font-style:italic}

/* Conversation */
.bloc{display:grid;grid-template-rows:38px 1fr;min-height:0}
.entete{display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600;font-size:13px;background:var(--panneau);border-bottom:1px solid var(--bord)}
.entete small{font-weight:400;color:var(--pale)}
.fil{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{display:grid;grid-template-columns:30px 1fr;gap:8px}
.msg .mini{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.msg .qui{font-size:12px;color:var(--doux)}.msg .qui b{color:var(--texte);margin-right:6px}
.msg .bulle{background:#262626;border-radius:6px;padding:7px 10px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.msg .bulle.brief{border-left:3px solid var(--accent);color:var(--doux);font-size:12.5px}
.msg .bulle.rapport{border-left:3px solid var(--ok)}
.sys{text-align:center;color:var(--pale);font-size:12px}
.sys.ok{color:var(--ok)}.sys.alerte{color:var(--alerte)}.sys.erreur{color:var(--erreur)}
.fin{border:1px solid var(--bord);border-radius:8px;padding:10px 12px;background:#202020}
.fin h3{margin:0 0 4px;font-size:13px}
.fin .chiffres{color:var(--doux);font-size:12px;margin-bottom:6px}

/* Journal */
.journal{overflow:auto;padding:6px 10px;font:11.5px/1.5 var(--mono);min-height:0;background:#101010}
.ligne{display:grid;grid-template-columns:64px 92px 1fr;gap:8px;color:#9a9a9a}
.ligne .h{color:var(--pale)}
.ligne .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne.alerte{color:var(--alerte)}.ligne.erreur{color:var(--erreur)}.ligne.ok{color:var(--ok)}

/* Bandeau */
.bandeau{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:#3a2a10;border:1px solid var(--alerte);color:#ffd99a;padding:8px 14px;border-radius:8px;max-width:760px;z-index:5;display:none;font-size:13px}
.bandeau.visible{display:block}
.bandeau button{margin-left:12px}

@media (max-width:1000px){
  .corps{grid-template-columns:minmax(0,1fr)}
  .barre{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:8px}
  .ctrl{flex:1 1 100%;flex-wrap:wrap}
  select{max-width:100%}
  .app{grid-template-rows:auto 1fr}
  .cote{grid-template-rows:320px 220px;border-top:1px solid var(--bord)}
  .app{height:auto;min-height:100vh}
  .scene{min-height:640px}
}
</style>
</head>
<body>
<div class="app">
  <header class="barre">
    <div class="titre"><span class="pastille" id="pastille"></span><h1 id="titre">Salle de réunion des agents</h1></div>
    <span class="etat" id="etat">En attente d'un cycle…</span>
    <span class="chrono" id="chrono">00:00</span>
    <span class="quota" id="quota" title="Consommation de ton abonnement Claude, d'après les cycles"></span>
    <span class="espace"></span>
    <div class="ctrl">
      <select id="choixCycle" title="Revoir un cycle passé"><option value="">Revoir un cycle…</option></select>
      <select id="vitesse" title="Vitesse du rejeu"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select>
      <button class="btn" id="btnDirect" title="Suivre le cycle en cours">● Direct</button>
      <button class="btn" id="btnDemo" title="Rejouer une réunion d'exemple">Démo</button>
      <select id="choixVoix" title="Voix des agents"><option value="sons">Sons seuls</option></select>
      <label class="case" title="Annoncer à voix haute chaque action des agents"><input type="checkbox" id="lireActions" checked> chaque action</label>
      <button class="btn" id="btnSon" title="Activer les sons et la voix">🔇 Son coupé</button>
    </div>
  </header>
  <main class="corps">
    <section class="scene">
      <div class="zone-tuiles" id="zoneTuiles">
        <div class="tuiles" id="tuiles"></div>
        <div class="vide" id="vide">Personne dans la salle. Les agents rejoignent la réunion quand un cycle démarre.</div>
        <div class="anciens" id="anciens"></div>
      </div>
      <div class="terminaux">
        <div class="onglets" id="onglets"></div>
        <pre class="console" id="console"></pre>
      </div>
    </section>
    <aside class="cote">
      <div class="bloc">
        <div class="entete">Conversation <small id="nbMsg"></small></div>
        <div class="fil" id="fil"></div>
      </div>
      <div class="bloc">
        <div class="entete">Journal <small><label><input type="checkbox" id="defilement" checked> suivre</label></small></div>
        <div class="journal" id="journal"></div>
      </div>
    </aside>
  </main>
</div>
<div class="bandeau" id="bandeau"><span id="bandeauTexte"></span><button class="btn" onclick="this.parentElement.classList.remove('visible')">OK</button></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Participants connus. Tout autre sous-agent rejoint avec un profil générique.
// ---------------------------------------------------------------------------
const PROFILS = {
  pilote:        {nom:"Chef d'équipe",   role:"Donne les créneaux · valide",  couleur:"#8a63d2", voix:{pitch:1.0, rate:1.08}},
  organisateur:  {nom:"Organisateur",    role:"Parle à Ange · plan et rapports", couleur:"#c47a2c", voix:{pitch:0.85,rate:1.0}},
  orchestrateur: {nom:"Organisateur",    role:"Parle à Ange · plan et rapports", couleur:"#c47a2c", voix:{pitch:0.85,rate:1.0}},
  developpeur:   {nom:"Développeur",     role:"Django · Next.js",            couleur:"#2f8f6b", voix:{pitch:1.15,rate:1.12}},
  qa:            {nom:"QA",              role:"Revue qualité",               couleur:"#3a7bd5", voix:{pitch:0.95,rate:1.05}},
};
for (const [cle, p] of Object.entries(PROFILS)) p.cle = cle;
const COULEURS_LIBRES = ["#a3477d","#5d7f2a","#8c6d1f","#4f6bb3"];
const OUTILS_AGENT = new Set(["Agent","Task"]);
const MAX_LIGNES_SORTIE = 40;

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const initiales = nom => nom.split(/[\s·-]+/).filter(Boolean).slice(0,2).map(m => m[0].toUpperCase()).join("");
const heure = d => d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const court = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);

// ---------------------------------------------------------------------------
// Audio : sons de connexion (Web Audio) et voix (synthèse vocale du navigateur)
// ---------------------------------------------------------------------------
const Son = {
  actif:false, ctx:null, moteur:"sons", piper:false, voixNav:[], voix:null, enAttente:0, chaine:Promise.resolve(),
  activer(){
    this.actif = !this.actif;
    if (this.actif && !this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (!this.actif){ speechSynthesis.cancel(); if (this.lecteur) this.lecteur.pause(); }
    $("btnSon").textContent = this.actif ? "🔊 Son activé" : "🔇 Son coupé";
    $("btnSon").classList.toggle("actif", this.actif);
  },
  // Liste les voix françaises du navigateur, les plus naturelles d'abord (eSpeak en dernier).
  choisirVoix(){
    const score = v => (/google|natural|neural|online|premium|enhanced|microsoft/i.test(v.name) ? 0 : 2)
                     + (/espeak|mbrola/i.test(v.name) ? 3 : 0) + (/^fr[-_]FR/i.test(v.lang) ? 0 : 1);
    this.voixNav = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)).sort((a, b) => score(a) - score(b));
    remplirChoixVoix();
  },
  ton(freqs, duree = .11){
    if (!this.actif || !this.ctx) return;
    let t = this.ctx.currentTime;
    for (const f of freqs){
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + duree);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + duree + .02);
      t += duree * .9;
    }
  },
  entree(){ this.ton([523, 659, 784]); },
  sortie(){ this.ton([784, 659, 523]); },
  alerte(){ this.ton([440, 349, 440, 349], .14); },
  // Rend une promesse résolue à la fin de la phrase (utile pour rythmer le rejeu).
  // options.action : annonce d'une action (courte, dite un peu plus vite) ;
  // options.priorite : jamais sautée (entrées, sorties, PR, refus, messages).
  dire(texte, profil, options = {}){
    if (!this.actif || this.moteur === "sons" || !texte) return Promise.resolve();
    if (options.action && !$("lireActions").checked) return Promise.resolve();
    const phrase = nettoyerPourVoix(texte);
    if (!phrase) return Promise.resolve();
    // En direct, si les agents vont plus vite que la parole, on garde les annonces
    // importantes et on saute les actions les plus anciennes plutôt que d'accumuler du retard.
    if (Etat.mode !== "rejeu" && !options.priorite && this.enAttente >= 8) return Promise.resolve();
    const vitesse = options.action ? 1.15 : 1;
    this.enAttente++;
    const fin = () => { this.enAttente = Math.max(0, this.enAttente - 1); };
    let promesse;
    if (this.moteur === "piper"){
      // La synthèse démarre tout de suite ; la lecture attend la fin de la phrase précédente.
      const cle = (profil && profil.cle) || "defaut";
      const audio = fetch(`/api/voix?agent=${encodeURIComponent(cle)}&texte=${encodeURIComponent(phrase)}`)
        .then(r => r.ok ? r.blob() : Promise.reject(new Error("voix " + r.status)));
      promesse = this.chaine.then(() => audio).then(b => this.jouer(b, vitesse))
        .catch(() => this.parlerNavigateur(phrase, profil, vitesse));
    } else {
      promesse = this.chaine.then(() => this.parlerNavigateur(phrase, profil, vitesse));
    }
    promesse = promesse.finally(fin);
    this.chaine = promesse.catch(() => {});
    return promesse;
  },
  jouer(blob, vitesse = 1){
    return new Promise(resolve => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("audio");
      a.src = url; a.playbackRate = vitesse * (Etat.mode === "rejeu" ? Math.min(1.5, 0.95 + Etat.vitesse * .1) : 1);
      this.lecteur = a;
      const fini = () => { URL.revokeObjectURL(url); resolve(); };
      a.onended = fini; a.onerror = fini;
      a.play().catch(fini);
    });
  },
  parlerNavigateur(phrase, profil, vitesse = 1){
    if (!("speechSynthesis" in window)) return Promise.resolve();
    return new Promise(resolve => {
      const u = new SpeechSynthesisUtterance(phrase);
      u.lang = "fr-FR";
      const v = this.voixNav.find(x => x.name === this.moteur) || this.voixNav[0];
      if (v) u.voice = v;
      const r = (profil && profil.voix) || {pitch:1, rate:1.05};
      u.pitch = r.pitch; u.rate = r.rate * vitesse * (Etat.mode === "rejeu" ? Math.min(1.4, 0.9 + Etat.vitesse * .15) : 1);
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(resolve, 15000); // garde-fou
    });
  },
};
function remplirChoixVoix(){
  const s = $("choixVoix"); if (!s) return;
  // Choix de l'utilisateur s'il en a fait un, sinon la meilleure voix disponible.
  let garde = Son.choixUtilisateur || null;
  try { garde = garde || localStorage.getItem("salle-voix"); } catch {}
  s.innerHTML = "";
  if (Son.piper) s.append(new Option("Voix naturelles (Piper)", "piper"));
  for (const v of Son.voixNav) s.append(new Option("Navigateur : " + v.name, v.name));
  s.append(new Option("Sons seuls", "sons"));
  const valeurs = [...s.options].map(o => o.value);
  Son.moteur = garde && valeurs.includes(garde) ? garde : valeurs[0];
  s.value = Son.moteur;
}
speechSynthesis.onvoiceschanged = () => Son.choisirVoix();

function nettoyerPourVoix(t){
  t = t.replace(/```[\s\S]*?```/g, " ").replace(/`([^`]*)`/g, "$1").replace(/[#*_>|]/g, " ")
       .replace(/https?:\/\/\S+/g, "lien").replace(/\s+/g, " ").trim();
  const phrases = t.match(/[^.!?]+[.!?]?/g) || [t];
  return court(phrases.slice(0, 2).join(" ").trim(), 240);
}

// ---------------------------------------------------------------------------
// Ce que chaque agent dit quand il agit (première personne, comme en réunion)
// ---------------------------------------------------------------------------
const nomFichier = p => {
  const b = (p || "").split("/").pop() || "";
  return b.replace(/\.(py|tsx?|jsx?|mjs|json|md|txt|toml|ya?ml|css|html|sh|jsonl)$/i, "").replace(/[-_.]+/g, " ").trim() || "un fichier";
};
const nomBranche = b => (b || "").replace(/^origin\//, "").replace(/[-_/]+/g, " ");
const REGLES_COMMANDES = [
  [/pytest/, "Je lance les tests du backend."],
  [/\bruff\b/, "Je vérifie le style du code Python."],
  [/npm (run )?lint|eslint/, "Je vérifie le style du frontend."],
  [/typecheck|\btsc\b/, "Je vérifie les types TypeScript."],
  [/makemigrations.*--check/, "Je vérifie que les migrations sont à jour."],
  [/makemigrations/, "Je génère les migrations."],
  [/manage\.py migrate/, "J'applique les migrations."],
  [/manage\.py check/, "Je vérifie la configuration de Django."],
  [/pip install/, "J'installe les dépendances Python."],
  [/npm audit/, "Je vérifie les failles de sécurité des dépendances."],
  [/npm (install|ci)\b/, "J'installe les dépendances du frontend."],
  [/npm run build|next build/, "Je compile le frontend."],
  [/docker compose (up|restart)/, "Je démarre les conteneurs."],
  [/docker compose (ps|logs)/, "Je regarde l'état des conteneurs."],
  [/^gh issue view (\d+)/, m => `Je lis l'issue ${m[1]}.`],
  [/^gh issue list/, "Je consulte la liste des issues."],
  [/^gh issue comment (\d+)/, m => `Je commente l'issue ${m[1]}.`],
  [/^gh issue edit (\d+)/, m => `Je mets à jour l'issue ${m[1]}.`],
  [/^gh pr create/, "J'ouvre une pull request."],
  [/^gh pr (view|diff) (\d+)/, m => `Je lis la pull request ${m[2]}.`],
  [/^gh pr list/, "Je consulte les pull requests."],
  [/^gh pr checkout (\d+)/, m => `Je récupère la pull request ${m[1]}.`],
  [/^gh pr review (\d+)/, m => `Je publie ma revue de la pull request ${m[1]}.`],
  [/^gh pr comment (\d+)/, m => `Je commente la pull request ${m[1]}.`],
  [/^gh label/, "Je regarde les étiquettes."],
  [/^gh /, "J'interroge GitHub."],
  [/git( -C \S+)? status/, "Je regarde l'état du dépôt."],
  [/git( -C \S+)? (diff|grep)/, "Je regarde les modifications."],
  [/git( -C \S+)? log/, "Je consulte l'historique."],
  [/git( -C \S+)? show/, "Je regarde un commit."],
  [/git( -C \S+)? add/, "Je prépare les fichiers à enregistrer."],
  [/git( -C \S+)? commit/, "J'enregistre un commit."],
  [/git( -C \S+)? (switch|checkout) -[cb] (\S+)/, m => `Je crée la branche ${nomBranche(m[3])}.`],
  [/git( -C \S+)? (switch|checkout) (\S+)/, m => `Je passe sur la branche ${nomBranche(m[3])}.`],
  [/git( -C \S+)? pull/, "Je récupère les dernières modifications."],
  [/git( -C \S+)? push/, "J'envoie mes modifications sur GitHub."],
  [/git( -C \S+)? fetch/, "Je synchronise avec GitHub."],
  [/git( -C \S+)? branch/, "Je regarde les branches."],
  [/^git /, "J'utilise Git."],
  [/^(ls|find|tree)\b/, "Je parcours les dossiers."],
  [/^(cat|head|tail|less|wc)\b/, "Je lis un fichier."],
  [/^(grep|rg)\b/, "Je cherche dans le code."],
  [/^sed /, "Je modifie un fichier."],
  [/^(mkdir|touch|cp|mv)\b/, "Je range des fichiers."],
  [/^(python|node|npx)\b/, "J'exécute un script."],
];
function phraseCommande(c){
  c = (c || "").trim();
  for (const [motif, phrase] of REGLES_COMMANDES){
    const m = c.match(motif);
    if (m) return typeof phrase === "function" ? phrase(m) : phrase;
  }
  return "Je lance une commande.";
}
function phraseAction(nom, e){
  e = e || {};
  switch (nom){
    case "Bash": return phraseCommande(e.command);
    case "Read": return `Je lis le fichier ${nomFichier(e.file_path)}.`;
    case "Write": return `Je crée le fichier ${nomFichier(e.file_path)}.`;
    case "Edit": case "MultiEdit": return `Je modifie le fichier ${nomFichier(e.file_path)}.`;
    case "NotebookEdit": return "Je modifie un notebook.";
    case "Grep": return "Je cherche dans le code.";
    case "Glob": return "Je liste des fichiers.";
    case "TodoWrite": return "Je mets à jour ma liste de tâches.";
    case "WebSearch": return "Je fais une recherche sur le web.";
    case "WebFetch": return "Je consulte une page web.";
    case "Skill": return "J'utilise une compétence.";
    case "ToolSearch": return "Je cherche un outil.";
    default: return "J'utilise l'outil " + nom.replace(/^mcp__/, "").replace(/__/g, " ").replace(/_/g, " ") + ".";
  }
}
// Ce qui mérite d'être dit à la fin d'une action : résultats de tests, échecs, PR ouverte…
function phraseResultat(appel, texte, erreur){
  const c = (appel.input && appel.input.command) || "";
  if (appel.nom === "Bash"){
    if (/pytest/.test(c)){
      const ok = texte.match(/(\d+) passed/), ko = texte.match(/(\d+) failed/), err = texte.match(/(\d+) errors?\b/);
      if (ko || err) return [ko && `${ko[1]} tests en échec`, err && `${err[1]} erreurs`].filter(Boolean).join(" et ") + ".";
      if (ok) return `${ok[1]} tests réussis.`;
    }
    if (/\bruff\b/.test(c) && /All checks passed/i.test(texte)) return "Aucune erreur de style.";
    if (/makemigrations.*--check/.test(c) && /No changes detected/i.test(texte)) return "Les migrations sont à jour.";
    if (/gh pr create/.test(c)){ const m = texte.match(/pull\/(\d+)/); if (m) return `La pull request ${m[1]} est ouverte.`; }
    if (erreur && !appel.refuse){
      if (/\bruff\b|lint|eslint/.test(c)){ const m = texte.match(/Found (\d+) errors?/); return m ? `Il reste ${m[1]} erreurs de style.` : "Il reste des erreurs de style."; }
      if (/typecheck|\btsc\b/.test(c)) return "Il y a des erreurs de types.";
      if (/makemigrations.*--check/.test(c)) return "Il manque des migrations.";
    }
  }
  if (erreur && !appel.refuse) return "Ça n'a pas marché.";
  return null;
}
// Pourquoi une commande a été refusée, et comment l'éviter
function conseilRefus(c){
  c = c || "";
  if (/\bgit -C\b|docker compose -f\b|\/home\/[^ ]*Blueprint_Academy/.test(c)) return "forme avec chemin explicite (git -C, docker compose -f) : lancer la commande depuis la racine du dépôt";
  if (/\bfor\b|\bwhile\b|;|&&|\|\||\|/.test(c)) return "commande composée : une commande simple à la fois";
  if (/^sed -i|>\s*\S/.test(c)) return "modification de fichier par le shell : utiliser l'outil Edit";
  if (/\/tmp\//.test(c)) return "fichier hors du dépôt : utiliser logs/";
  return "commande hors de la liste autorisée (.claude/settings.json)";
}

// ---------------------------------------------------------------------------
// État de la réunion
// ---------------------------------------------------------------------------
const Etat = {
  mode:"attente",   // attente | direct | rejeu
  vitesse:1,
  rattrapage:false, // lignes déjà écrites quand on rejoint un cycle en cours : pas de voix
  debut:null, fin:null,
  participants:new Map(),   // cle -> participant
  appels:new Map(),         // tool_use_id -> {cle, nom, input}
  convocations:new Map(),   // tool_use_id d'un Agent -> cle du participant
  terminalSel:null, epingle:false, nbMsg:0, rejeuJeton:0,
};

function reinitialiser(titre){
  speechSynthesis.cancel();
  Object.assign(Etat, {debut:null, fin:null, terminalSel:null, epingle:false, nbMsg:0});
  Etat.participants.clear(); Etat.appels.clear(); Etat.convocations.clear();
  $("tuiles").innerHTML = ""; $("anciens").textContent = "";
  $("vide").textContent = "Personne dans la salle pour l’instant."; $("vide").style.display = "";
  $("onglets").innerHTML = ""; $("console").innerHTML = ""; $("fil").innerHTML = ""; $("journal").innerHTML = "";
  $("nbMsg").textContent = ""; $("titre").textContent = titre || "Salle de réunion des agents";
  $("quota").textContent = "";
  $("bandeau").classList.remove("visible");
}

function participant(cle){
  if (Etat.participants.has(cle)) return Etat.participants.get(cle);
  const base = PROFILS[cle] || {nom: cle.replace(/[-_]/g," ").replace(/^\w/, c => c.toUpperCase()), role:"Sous-agent",
                                couleur: COULEURS_LIBRES[Etat.participants.size % COULEURS_LIBRES.length], voix:{pitch:1,rate:1.05}};
  const p = {cle, ...base, present:false, lignes:[], tuile:null, onglet:null, aParticipe:false};
  Etat.participants.set(cle, p);
  return p;
}

// -- Rendu des tuiles ----------------------------------------------------
function disposer(){
  const zone = $("tuiles"), tuiles = [...zone.children];
  const n = tuiles.length; if (!n) return;
  const W = zone.clientWidth, H = zone.clientHeight, g = 12;
  let meilleur = 0;
  for (let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const w = Math.min((W - g * (cols - 1)) / cols, ((H - g * (rows - 1)) / rows) * 16 / 9);
    if (w > meilleur) meilleur = w;
  }
  meilleur = Math.max(Math.min(160, W), Math.min(meilleur, 760));
  for (const t of tuiles){ t.style.width = meilleur + "px"; t.style.height = meilleur * 9 / 16 + "px"; }
}
new ResizeObserver(disposer).observe(document.getElementById("tuiles"));
function rejoindre(cle, motif){
  const p = participant(cle);
  if (p.present) return p;
  p.present = true; p.aParticipe = true;
  $("vide").style.display = "none";
  const t = el("div", "tuile");
  const av = el("div", "avatar", initiales(p.nom)); av.style.background = p.couleur;
  const st = el("div", "statut", motif ? court(motif, 80) : "vient d’arriver");
  const et = el("div", "etiquette");
  const nom = el("div", "nom"); nom.append(el("span", null, p.nom));
  const onde = el("span", "onde"); onde.innerHTML = "<i></i><i></i><i></i>"; nom.append(onde);
  et.append(nom, el("div", "role", p.role));
  t.append(st, av, et);
  $("tuiles").append(t);
  p.tuile = t; p.statutEl = st;
  disposer();
  creerOnglet(p);
  if (!Etat.epingle) choisirTerminal(cle);
  systeme(`${p.nom} rejoint la réunion${motif ? " : " + court(motif, 90) : ""}`);
  journal("entrée", p.nom + (motif ? " — " + motif : ""), "ok");
  if (!Etat.rattrapage){ Son.entree(); return Son.dire(`${p.nom} rejoint la réunion.`, PROFILS.pilote, {priorite:true}); }
}

function quitter(cle, bilan){
  const p = Etat.participants.get(cle);
  if (!p || !p.present) return;
  p.present = false;
  if (p.tuile){ const t = p.tuile; p.tuile = null; t.classList.add("partie"); setTimeout(() => { t.remove(); disposer(); afficherAnciens(); }, 550); }
  if (p.onglet) p.onglet.classList.remove("travaille");
  if (bilan) message(cle, bilan, "rapport");
  afficherAnciens();
  systeme(`${p.nom} quitte la réunion`);
  journal("sortie", p.nom);
  if (!Etat.rattrapage){ Son.sortie(); Son.dire(`${p.nom} quitte la réunion.`, PROFILS.pilote, {priorite:true}); }
}

function afficherAnciens(){
  const pres = [...Etat.participants.values()].filter(p => p.present);
  const anciens = [...Etat.participants.values()].filter(p => !p.present && p.aParticipe);
  $("vide").style.display = pres.length ? "none" : "";
  if (!pres.length) $("vide").textContent = Etat.fin ? "Réunion terminée." : "Personne dans la salle pour l’instant.";
  $("anciens").textContent = anciens.length ? "Ont participé : " + anciens.map(p => p.nom).join(", ") : "";
}

let minuteurParole = new Map();
function statut(cle, texte, parle){
  const p = participant(cle);
  if (!p.tuile) return;
  if (texte != null) p.statutEl.textContent = court(texte, 90);
  p.tuile.classList.toggle("parle", !!parle);
  p.tuile.classList.toggle("agit", !parle);
  if (p.onglet) p.onglet.classList.toggle("travaille", !parle && texte != null);
  clearTimeout(minuteurParole.get(cle));
  if (parle) minuteurParole.set(cle, setTimeout(() => p.tuile && p.tuile.classList.remove("parle"), 3500));
}

// -- Terminaux -------------------------------------------------------------
function creerOnglet(p){
  if (p.onglet) return;
  const o = el("div", "onglet");
  const pt = el("span", "point"); pt.style.background = p.couleur;
  o.append(pt, el("span", null, p.nom), el("span", "actif"));
  o.onclick = () => { Etat.epingle = Etat.terminalSel !== p.cle || !Etat.epingle; choisirTerminal(p.cle); };
  $("onglets").append(o); p.onglet = o;
}
function choisirTerminal(cle){
  Etat.terminalSel = cle;
  for (const p of Etat.participants.values()) if (p.onglet){
    p.onglet.classList.toggle("sel", p.cle === cle);
    const e = p.onglet.querySelector(".epingle"); if (e) e.remove();
    if (p.cle === cle && Etat.epingle) p.onglet.append(el("span", "epingle", "épinglé"));
  }
  const c = $("console"); c.innerHTML = "";
  const p = Etat.participants.get(cle);
  if (p) for (const n of p.lignes) c.append(n.cloneNode(true));
  c.scrollTop = c.scrollHeight;
}
function ecrireTerminal(cle, noeud){
  const p = participant(cle);
  p.lignes.push(noeud);
  if (p.lignes.length > 600) p.lignes.splice(0, 100);
  if (!Etat.epingle && Etat.terminalSel !== cle && p.onglet) choisirTerminal(cle);
  else if (Etat.terminalSel === cle){ const c = $("console"); const bas = c.scrollHeight - c.scrollTop - c.clientHeight < 60; c.append(noeud.cloneNode(true)); if (bas) c.scrollTop = c.scrollHeight; }
}
function ligneTerminal(cls, texte, gras){
  const d = el("div", cls);
  if (gras){ const b = el("b", null, gras); d.append(b, document.createTextNode(" " + texte)); } else d.textContent = texte;
  return d;
}

// -- Conversation et journal -----------------------------------------------
function message(cle, texte, genre){
  const p = participant(cle);
  const m = el("div", "msg");
  const mini = el("div", "mini", initiales(p.nom)); mini.style.background = p.couleur;
  const corps = el("div");
  const qui = el("div", "qui"); qui.append(el("b", null, p.nom), document.createTextNode(heure(new Date())));
  corps.append(qui, el("div", "bulle" + (genre ? " " + genre : ""), court(texte, genre === "brief" ? 500 : 1800)));
  m.append(mini, corps);
  ajouterFil(m);
  $("nbMsg").textContent = ++Etat.nbMsg + " messages";
}
function systeme(texte, genre){ ajouterFil(el("div", "sys" + (genre ? " " + genre : ""), texte)); }
function ajouterFil(n){ const f = $("fil"); const bas = f.scrollHeight - f.scrollTop - f.clientHeight < 80; f.append(n); if (bas) f.scrollTop = f.scrollHeight; }
function journal(type, texte, genre){
  const l = el("div", "ligne" + (genre ? " " + genre : ""));
  l.append(el("span", "h", heure(new Date())), el("span", null, type), el("span", "t", texte));
  l.title = texte;
  const j = $("journal"); j.append(l);
  if (j.children.length > 1500) j.firstChild.remove();
  if ($("defilement").checked) j.scrollTop = j.scrollHeight;
}
function alerter(texte){
  if (Etat.rattrapage){ systeme(texte, "alerte"); return; } // cycle déjà vu : pas de popup
  $("bandeauTexte").textContent = texte; $("bandeau").classList.add("visible");
  Son.alerte();
}

// ---------------------------------------------------------------------------
// Lecture des événements de Claude Code (--output-format stream-json)
// ---------------------------------------------------------------------------
function texteResultat(contenu){
  if (typeof contenu === "string") return contenu;
  if (Array.isArray(contenu)) return contenu.map(c => c.type === "text" ? c.text : (c.type === "image" ? "[image]" : "")).join("\n");
  return contenu == null ? "" : JSON.stringify(contenu);
}
function proprietaire(evt){
  const parent = evt.parent_tool_use_id;
  if (!parent) return "pilote";
  if (Etat.convocations.has(parent)) return Etat.convocations.get(parent);
  const cle = "sous-agent-" + parent.slice(-4);
  Etat.convocations.set(parent, cle); rejoindre(cle, "sous-agent");
  return cle;
}
function decrireOutil(nom, e){
  e = e || {};
  switch (nom){
    case "Bash": return {gras:"$", texte:e.command || "", statut:"$ " + (e.command || "")};
    case "Read": return {texte:"▸ Lit " + (e.file_path || ""), statut:"Lit " + base(e.file_path)};
    case "Write": return {texte:"✎ Écrit " + (e.file_path || "") + compterLignes(e.content), statut:"Écrit " + base(e.file_path)};
    case "Edit": return {texte:"✎ Modifie " + (e.file_path || "") + diffCourt(e), statut:"Modifie " + base(e.file_path)};
    case "MultiEdit": return {texte:"✎ Modifie " + (e.file_path || "") + ` (${(e.edits||[]).length} changements)`, statut:"Modifie " + base(e.file_path)};
    case "Grep": return {texte:`▸ Cherche « ${e.pattern || ""} »` + (e.path ? " dans " + e.path : ""), statut:"Cherche " + (e.pattern || "")};
    case "Glob": return {texte:"▸ Liste " + (e.pattern || ""), statut:"Liste " + (e.pattern || "")};
    case "TodoWrite": return {texte:"▸ Met à jour sa liste de tâches", statut:"Organise ses tâches"};
    case "WebSearch": return {texte:"▸ Recherche web : " + (e.query || ""), statut:"Recherche " + (e.query || "")};
    case "WebFetch": return {texte:"▸ Ouvre " + (e.url || ""), statut:"Lit une page web"};
    default: return {texte:"▸ " + nom + " " + court(JSON.stringify(e), 160), statut:nom};
  }
}
const base = p => (p || "").split("/").slice(-2).join("/");
const compterLignes = t => t ? ` (${t.split("\n").length} lignes)` : "";
function diffCourt(e){
  const a = (e.old_string || "").split("\n").length, b = (e.new_string || "").split("\n").length;
  return e.old_string != null ? `  (−${a} +${b})` : "";
}

async function traiter(evt){
  const type = evt.type, sous = evt.subtype;
  if (type === "cycle_start"){
    reinitialiser(`Réunion · cycle ${evt.cycle}`);
    const depart = new Date(evt.started_at || Date.now());
    // En rejeu, le chronomètre mesure le rejeu ; en direct, le temps réel du cycle.
    Etat.debut = Etat.mode === "rejeu" ? new Date() : depart; Etat.fin = null;
    $("etat").textContent = "Cycle " + evt.cycle + " du " + depart.toLocaleDateString("fr-FR") + " à " + depart.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    journal("cycle", "Démarrage du cycle " + evt.cycle);
    return;
  }
  if (type === "cycle_end"){
    Etat.fin = Etat.fin || (Etat.mode === "rejeu" ? new Date() : new Date(evt.ended_at || Date.now()));
    if (evt.exit_code !== 0){
      const raison = evt.exit_code === 124 ? "délai de 90 minutes dépassé" : evt.exit_code === 3 ? "dossier non approuvé" : "quota atteint ou erreur";
      systeme(`Cycle arrêté (code ${evt.exit_code}) : ${raison}`, "erreur");
      alerter(`Le cycle s’est arrêté avant la fin (code ${evt.exit_code}) : ${raison}.`);
    }
    for (const p of Etat.participants.values()) if (p.present) quitter(p.cle);
    $("etat").textContent = "Cycle terminé"; afficherAnciens();
    return;
  }
  if (type === "system"){
    if (sous === "init"){
      if (!Etat.debut) Etat.debut = new Date();
      journal("session", `modèle ${evt.model || "?"}, mode ${evt.permissionMode || "?"}`);
      return rejoindre("pilote", "ouvre la réunion");
    }
    if (sous === "dossier_non_approuve"){
      systeme("Cycle annulé : dossier non approuvé par Claude Code", "erreur");
      alerter("Cycle annulé : le dossier du dépôt n’est pas approuvé. Lance « claude » une fois dans le dépôt, accepte l’approbation, puis relance le cycle.");
      return;
    }
    if (sous === "api_retry"){ journal("réessai", `tentative ${evt.attempt}/${evt.max_retries} (${evt.error || "erreur"})`, "alerte"); return; }
    if (sous === "permission_denied" || /denied/i.test(sous || "")){
      const appel = Etat.appels.get(evt.tool_use_id);
      const qui = appel ? participant(appel.cle) : null;
      const cmd = appel ? (appel.input.command || appel.input.file_path || appel.nom) : (evt.tool_name || "?");
      if (appel) appel.refuse = true;
      const texte = `Action refusée${qui ? " à " + qui.nom : ""} : ${court(cmd, 140)} — ${conseilRefus(cmd)}`;
      journal("refus", texte, "erreur"); systeme(texte, "erreur");
      if (appel) ecrireTerminal(appel.cle, ligneTerminal("err", "✗ refusé : " + conseilRefus(cmd)));
      if (!Etat.rattrapage && qui) return Son.dire("Cette action m'a été refusée.", qui, {priorite:true});
      return;
    }
    if (sous === "task_started"){
      // Sous-agent : déjà convoqué par son appel d'outil. Sinon : tâche lancée en arrière-plan.
      if (!evt.subagent_type){
        const appel = Etat.appels.get(evt.tool_use_id);
        journal("arrière-plan", `${appel ? participant(appel.cle).nom + " : " : ""}${evt.description || "tâche"}`);
      }
      return;
    }
    if (sous === "task_progress"){
      const cle = evt.subagent_type ? evt.subagent_type.toLowerCase() : null;
      if (cle && Etat.participants.has(cle) && evt.description) statut(cle, evt.description.replace(/^Running /, ""), false);
      return;
    }
    if (sous === "task_notification"){
      journal("tâche finie", `${evt.summary || evt.task_id} (${evt.status || "?"})`, evt.status === "failed" ? "erreur" : null);
      return;
    }
    if (sous === "vcs_state_changed"){
      const texte = evt.kind === "commit" ? `Nouveau commit sur ${evt.branch}` : `Dépôt : ${evt.kind || "changement"}${evt.branch ? " sur " + evt.branch : ""}`;
      systeme(texte, "ok"); journal("git", texte, "ok");
      return;
    }
    if (sous === "code_change_published"){
      const n = evt.identifier || "";
      const ligne = el("div", "sys ok");
      ligne.append(document.createTextNode(`Pull request #${n} ${evt.action === "created" ? "créée" : "mise à jour"} : `));
      const a = el("a", null, evt.url || ""); a.href = evt.url || "#"; a.target = "_blank"; ligne.append(a);
      ajouterFil(ligne); journal("pull request", `#${n} ${evt.action || ""} ${evt.url || ""}`, "ok");
      if (!Etat.rattrapage) return Son.dire(`La pull request ${n} vient d'être ${evt.action === "created" ? "créée" : "mise à jour"} sur GitHub.`, PROFILS.pilote, {priorite:true});
      return;
    }
    if (/^(task_updated|hook_progress|hook_started)$/.test(sous || "")) return;
    if (sous === "hook_response"){ journal("hook", evt.hook_name || "?"); return; }
    journal(sous || "système", court(JSON.stringify(evt), 160));
    return;
  }
  if (type === "rate_limit_event"){
    const f = (evt.rate_limit_info && evt.rate_limit_info.unifiedWindows) || {};
    const pct = w => w && w.utilization != null ? Math.round(w.utilization * 100) + " %" : "?";
    const u = Math.max((f.five_hour || {}).utilization || 0, (f.seven_day || {}).utilization || 0);
    const q = $("quota");
    q.textContent = `⏱ ${pct(f.five_hour)} · 7 j ${pct(f.seven_day)}`;
    q.title = `Quota de ton abonnement Claude : ${pct(f.five_hour)} de la fenêtre de 5 heures, ${pct(f.seven_day)} de la semaine`;
    q.className = "quota" + (u >= .9 ? " critique" : u >= .7 ? " haut" : "");
    if (evt.rate_limit_info && evt.rate_limit_info.status && evt.rate_limit_info.status !== "allowed")
      alerter("Limite d’usage Claude atteinte : le cycle va s’interrompre ou ralentir.");
    return;
  }
  if (type === "tool_progress") return; // battements de cœur des sous-agents
  if (type === "assistant"){
    const cle = proprietaire(evt);
    let attente = Promise.resolve();
    for (const b of (evt.message && evt.message.content) || []){
      if (b.type === "text" && b.text && b.text.trim()){
        message(cle, b.text.trim());
        statut(cle, "parle", true);
        journal("message", participant(cle).nom + " : " + court(b.text.trim().replace(/\s+/g, " "), 120));
        if (!Etat.rattrapage) attente = Son.dire(b.text, participant(cle), {priorite:true});
      } else if (b.type === "thinking"){
        statut(cle, "réfléchit…", false);
      } else if (b.type === "tool_use"){
        const e = b.input || {};
        Etat.appels.set(b.id, {cle, nom:b.name, input:e});
        if (OUTILS_AGENT.has(b.name)){
          const invite = (e.subagent_type || e.agent_type || "sous-agent").toLowerCase();
          Etat.convocations.set(b.id, invite);
          const d = e.description || "";
          ecrireTerminal(cle, ligneTerminal("action", `▸ Convoque ${participant(invite).nom}${d ? " : " + d : ""}`));
          statut(cle, "attend " + participant(invite).nom, false);
          journal("convocation", `${participant(cle).nom} → ${participant(invite).nom}${d ? " : " + d : ""}`);
          const r = rejoindre(invite, d);
          if (e.prompt) message(cle, `@${participant(invite).nom} ${e.prompt}`, "brief");
          if (r) attente = r;
        } else {
          const o = decrireOutil(b.name, e);
          ecrireTerminal(cle, ligneTerminal(b.name === "Bash" ? "cmd" : "action", o.texte, o.gras));
          statut(cle, o.statut, false);
          journal(b.name, participant(cle).nom + " : " + court(o.texte, 140));
          if (!Etat.rattrapage) attente = Son.dire(phraseAction(b.name, e), participant(cle), {action:true});
        }
      }
    }
    return attente;
  }
  if (type === "user"){
    const contenu = (evt.message && evt.message.content) || [];
    if (typeof contenu === "string") return; // invite initiale, déjà affichée à la convocation
    for (const b of contenu){
      if (b.type !== "tool_result") continue;
      const appel = Etat.appels.get(b.tool_use_id);
      const texte = texteResultat(b.content);
      if (Etat.convocations.has(b.tool_use_id) && appel && OUTILS_AGENT.has(appel.nom)){
        const cle = Etat.convocations.get(b.tool_use_id);
        ecrireTerminal(appel.cle, ligneTerminal("sortie", `◂ ${participant(cle).nom} a terminé`));
        quitter(cle, court(texte.trim(), 900));
        statut(appel.cle, "reprend la main", false);
        continue;
      }
      if (!appel) continue;
      const bilan = phraseResultat(appel, texte, b.is_error);
      if (bilan && !Etat.rattrapage) Son.dire(bilan, participant(appel.cle), {action:true});
      const lignes = texte.replace(/\s+$/, "").split("\n");
      const visibles = lignes.slice(0, MAX_LIGNES_SORTIE).join("\n");
      if (visibles) ecrireTerminal(appel.cle, ligneTerminal(b.is_error ? "err" : "sortie", visibles));
      if (lignes.length > MAX_LIGNES_SORTIE) ecrireTerminal(appel.cle, ligneTerminal("masque", `… ${lignes.length - MAX_LIGNES_SORTIE} lignes masquées`));
      if (b.is_error){
        journal("erreur", `${participant(appel.cle).nom} : ${court(texte.replace(/\s+/g, " "), 140)}`, "erreur");
        if (!appel.refuse && /permission|not allowed|denied|refus/i.test(texte)) systeme(`${participant(appel.cle).nom} : action refusée (${appel.nom})`, "alerte");
      }
    }
    return;
  }
  if (type === "result"){
    Etat.fin = new Date();
    const d = evt.duration_ms ? Math.round(evt.duration_ms / 60000 * 10) / 10 + " min" : "";
    const carte = el("div", "fin");
    carte.append(el("h3", null, evt.is_error || (sous && sous !== "success") ? "Réunion terminée avec une erreur" : "Compte rendu de la réunion"));
    carte.append(el("div", "chiffres", [d, evt.num_turns ? evt.num_turns + " échanges" : ""].filter(Boolean).join(" · ")));
    if (evt.result) carte.append(el("div", null, court(evt.result, 1500)));
    ajouterFil(carte);
    const refus = evt.permission_denials || [];
    if (refus.length){
      const liste = refus.map(r => r.tool_name + (r.tool_input && r.tool_input.command ? " " + r.tool_input.command : "")).slice(0, 4).join(" ; ");
      journal("refus", `${refus.length} action(s) refusée(s) : ${liste}`, "erreur");
      // Une commande composée (boucle, ;, &&, |) n'est jamais couverte par les autorisations du projet.
      const premiere = (refus[0].tool_input && refus[0].tool_input.command) || "";
      alerter(`${refus.length} action(s) refusée(s) pendant le cycle. Exemple : ${court(premiere || liste, 120)} — ${conseilRefus(premiere)}. Le détail est dans la conversation.`);
    }
    for (const p of Etat.participants.values()) if (p.present) quitter(p.cle);
    journal("fin", "Fin de la session " + (sous || ""), sous === "success" ? "ok" : "erreur");
    $("etat").textContent = "Réunion terminée"; afficherAnciens();
    if (!Etat.rattrapage && evt.result) return Son.dire("Fin de la réunion. " + evt.result, PROFILS.pilote, {priorite:true});
    return;
  }
  journal(type || "?", court(JSON.stringify(evt), 160));
}

function lire(ligne){
  try { return JSON.parse(ligne); }
  catch { journal("texte", court(ligne, 200)); return null; }
}

// ---------------------------------------------------------------------------
// Modes : direct (SSE), rejeu d'un cycle passé, démo
// ---------------------------------------------------------------------------
let source = null;
function modeDirect(){
  arreterRejeu();
  if (source) source.close();
  Etat.mode = "direct"; reinitialiser("Réunion en direct");
  $("pastille").className = "pastille direct"; $("btnDirect").classList.add("actif");
  $("etat").textContent = "Connexion…";
  source = new EventSource("/api/direct");
  source.addEventListener("cycle", e => {
    const d = JSON.parse(e.data);
    reinitialiser("Réunion · " + d.nom.replace(/\.jsonl$/, ""));
    Etat.rattrapage = true;
    $("etat").textContent = d.termine ? "Dernier cycle (terminé)" : "Cycle en cours";
  });
  source.addEventListener("ligne", e => { const d = JSON.parse(e.data); Etat.rattrapage = d.rattrapage; const evt = lire(d.l); if (evt) traiter(evt); });
  source.addEventListener("direct", () => { Etat.rattrapage = false; journal("direct", "à jour, suivi en direct", "ok"); });
  source.onerror = () => { $("etat").textContent = "Connexion perdue, nouvelle tentative…"; };
  source.onopen = () => { if ($("etat").textContent.startsWith("Connexion")) $("etat").textContent = "En attente d’un cycle…"; };
}

function arreterRejeu(){ Etat.rejeuJeton++; speechSynthesis.cancel(); }
const pause = ms => new Promise(r => setTimeout(r, ms));

async function modeRejeu(nom, titre){
  if (source){ source.close(); source = null; }
  arreterRejeu(); const jeton = Etat.rejeuJeton;
  Etat.mode = "rejeu"; Etat.rattrapage = false;
  reinitialiser(titre); $("pastille").className = "pastille rejeu"; $("btnDirect").classList.remove("actif");
  $("etat").textContent = "Rejeu…";
  const rep = await fetch("/api/journal?cycle=" + encodeURIComponent(nom));
  if (!rep.ok){ alerter("Cycle introuvable : " + nom); return; }
  const lignes = (await rep.text()).split("\n").filter(l => l.trim());
  Etat.debut = new Date();
  for (const l of lignes){
    if (jeton !== Etat.rejeuJeton) return;
    const evt = lire(l); if (!evt) continue;
    const t0 = performance.now();
    await traiter(evt);
    const ecoule = performance.now() - t0;
    const base = evt.type === "assistant" ? 900 : evt.type === "user" ? 500 : 250;
    await pause(Math.max(60, base / Etat.vitesse - ecoule));
  }
  if (jeton === Etat.rejeuJeton) $("etat").textContent = "Rejeu terminé";
}

async function chargerCycles(){
  try{
    const liste = await (await fetch("/api/cycles")).json();
    const s = $("choixCycle"); const garde = s.value;
    s.innerHTML = '<option value="">Revoir un cycle…</option>';
    for (const c of liste){
      const m = c.nom.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})-(.+)\.jsonl$/);
      const o = el("option", null, m ? `${m[3]}/${m[2]} ${m[4]} h ${m[5]} · ${m[6]}` : c.nom);
      o.value = c.nom; s.append(o);
    }
    s.value = garde;
  } catch { /* serveur arrêté */ }
}

// Chronomètre
setInterval(() => {
  if (!Etat.debut){ $("chrono").textContent = "00:00"; return; }
  const s = Math.max(0, Math.floor(((Etat.fin || new Date()) - Etat.debut) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  $("chrono").textContent = (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}, 500);

$("btnSon").onclick = () => Son.activer();
try { if (localStorage.getItem("salle-actions") === "non") $("lireActions").checked = false; } catch {}
$("lireActions").onchange = e => { try { localStorage.setItem("salle-actions", e.target.checked ? "oui" : "non"); } catch {} };
$("choixVoix").onchange = e => { Son.moteur = Son.choixUtilisateur = e.target.value; try { localStorage.setItem("salle-voix", Son.moteur); } catch {} };
fetch("/api/voix/etat").then(r => r.json()).then(d => { Son.piper = !!d.disponible; Son.choisirVoix(); }).catch(() => Son.choisirVoix());
$("btnDirect").onclick = modeDirect;
$("btnDemo").onclick = () => { $("choixCycle").value = ""; modeRejeu("demo", "Démo · cycle tech (exemple)"); };
$("choixCycle").onchange = e => { if (e.target.value) modeRejeu(e.target.value, "Rejeu · " + e.target.selectedOptions[0].textContent); };
$("vitesse").onchange = e => { Etat.vitesse = Number(e.target.value); };
chargerCycles(); setInterval(chargerCycles, 20000);
if (new URLSearchParams(location.search).has("demo")) $("btnDemo").click(); else modeDirect();
</script>
